version: 1
name: paper
description: >
  Profile a target journal from a corpus of its papers, then produce an outline
  for a new manuscript in that venue.

defaults:
  max_turns: 30

vars:
  topic: "State your topic here, or override with --var topic=..."

  # Model roles rather than provider names, so the same pipeline runs on
  # whatever you have configured. Leave a role empty to fall back to the model
  # in ~/.pi/agent/settings.json.
  #
  # `bulk` handles high-volume mechanical work — one call per corpus paper —
  # where a cheap, fast model is the right trade. `judgement` handles the
  # synthesis and writing, where it is not.

  # The language the manuscript is written in. Left as-is it follows the corpus,
  # which is usually right — you submit in the language the venue publishes in.
  # State it explicitly when it differs, or when the corpus and your own material
  # are in different languages, which is where it otherwise goes wrong silently.
  #
  #   --var language="Write in Simplified Chinese. Keep technical terms,
  #                   acronyms, and cited titles in their original English."
  language: "Write in the same language the corpus papers are written in."

  bulk: ""
  judgement: ""

steps:
  # Deterministic: no model, no cost, identical every run.
  #
  # Three directories, three roles. Only corpus/ teaches the venue's norms; the
  # other two exist to be read and cited, and are deliberately kept out of the
  # profile so a paper from the wrong venue cannot skew what "this venue expects"
  # means.
  - id: ingest
    builtin: ingest
    with:
      from: corpus

  # Domain literature: citable, never profiled. These are other people's papers,
  # from wherever they were published.
  - id: ingest-references
    builtin: ingest
    with:
      from: references
      optional: true

  # The author's own material. Extraction only — `only: pdf` leaves their
  # Markdown and LaTeX where it is rather than copying it into source/text/,
  # which would put the same material in front of a writer twice.
  - id: ingest-source
    builtin: ingest
    with:
      from: source
      only: pdf
      optional: true

  # The map half. One session per paper, so a thirty-paper corpus never has to
  # fit in one context window, and a single unreadable file cannot discard the
  # analyses already paid for.
  - id: analyze
    agent: corpus-analyst
    model: ${vars.bulk}
    foreach: "corpus/text/*.md"
    parallel: 4
    input: |
      Analyse the paper at ${item.path}.
    output: analysis/papers/${item.id}.md

  # The reference library. A second map, but over a different question: not
  # "what does this venue expect" — these papers were published elsewhere — but
  # "what is in here, and what can each paper be cited for".
  #
  # `cache: true` because a card is a property of the paper, not of the run. At
  # several hundred references, re-analysing an unchanged library every run
  # would cost more than every other step combined.
  - id: analyze-references
    agent: reference-analyst
    model: ${vars.bulk}
    foreach: "references/text/*.md"
    parallel: 4
    cache: true
    optional: true
    input: |
      Summarise the paper at ${item.path} as one card.
    output: references/cards/${item.id}.md

  # Deterministic: collating cards needs no judgement, and paying a model to
  # re-read several hundred of them every run would cost more than writing them.
  - id: index-references
    builtin: build-index
    with:
      from: references/cards
      out: references/index.md

  # The reduce half. Reads only the per-paper analyses, never the papers.
  - id: profile
    agent: journal-profiler
    model: ${vars.judgement}
    input: |
      Read every analysis under analysis/papers/ and synthesise a profile of
      what this venue publishes and how it expects work to be written.

      Separate what is language-independent (structure, section order, evidence
      expectations, citation density) from what is specific to the language the
      corpus is written in (sentence length, voice, hedging phrases). The
      manuscript may be written in a different language, and only the first kind
      transfers directly.

      If fewer analyses are present than the corpus contains, some papers failed
      to analyse. Say so in the profile rather than presenting it as complete.
    output: analysis/journal-profile.md

  - id: outline
    agent: outliner
    model: ${vars.judgement}
    input: |
      Topic: ${vars.topic}
      Journal profile: ${steps.profile.outputs}

      The author's own material is under source/ (extracted PDFs in
      source/text/) — read all of it first. It is the only place the author's
      own claims and results come from.

      Domain literature the author may cite is catalogued in
      references/index.md, one line per paper. Read the index, then the few
      cards under references/cards/ that look relevant, and only then the full
      text under references/text/. It is other people's published work: cite it,
      never attribute it to the author.

      Produce the outline and the machine-readable section list.

      Language: ${vars.language}
    output:
      - outline/outline.md
      - outline/sections.json

  # Stop here. The outline is the cheapest place to change direction: every
  # later stage is written against it.
  - id: approve-outline
    gate: Approve the outline before drafting
    show: outline/outline.md
    on_reject: outline

  # The second map: one session per section, so each is written against the
  # outline rather than against the growing draft, and a long paper never has to
  # fit in one context window.
  - id: write
    agent: section-writer
    model: ${vars.judgement}
    foreach:
      json: outline/sections.json
      path: sections
    parallel: 3
    input: |
      Draft the section "${item.title}" (id ${item.id}).

      Outline:         outline/outline.md
      Journal profile: analysis/journal-profile.md
      Author material: source/ (extracted PDFs in source/text/)
      Literature:      references/index.md — scan it, then read only the cards
                       and full texts you actually need. Also analysis/papers/.

      Language: ${vars.language}
    output: draft/${item.id}.md

  # Deterministic: ordering and concatenation need no judgement.
  - id: assemble
    builtin: assemble
    with:
      sections: outline/sections.json
      from: draft
      out: draft/paper.md

  - id: review
    agent: reviewer
    model: ${vars.judgement}
    input: |
      Review the draft at draft/paper.md as a referee for this venue.
    output: review/review.md

  - id: approve-review
    gate: Read the review before the final pass
    show:
      - review/review.md
    on_reject: write

  - id: polish
    agent: polisher
    model: ${vars.judgement}
    input: |
      Produce the final manuscript from draft/paper.md, applying review/review.md.

      Language: ${vars.language}
    output: final/paper.md

  # Mandatory, and deterministic on purpose. A fabricated reference is the one
  # failure here that costs credibility rather than time, so verification must
  # not be something a model can be argued out of.
  - id: check-citations
    builtin: check-citations
    with:
      manuscript: final/paper.md
      sources: [corpus/text, references/text, references/cards, analysis/papers, source]
      out: review/citations.md
