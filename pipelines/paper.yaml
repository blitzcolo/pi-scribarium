version: 1
name: paper
description: >
  Profile a target journal from a corpus of its papers, then produce an outline
  for a new manuscript in that venue.

defaults:
  max_turns: 30

vars:
  topic: "State your topic here, or override with --var topic=..."

  # Model roles rather than provider names, so the same pipeline runs on
  # whatever you have configured. Leave a role empty to fall back to the model
  # in ~/.pi/agent/settings.json.
  #
  # `bulk` handles high-volume mechanical work — one call per corpus paper —
  # where a cheap, fast model is the right trade. `judgement` handles the
  # synthesis and writing, where it is not.
  bulk: ""
  judgement: ""

steps:
  # Deterministic: no model, no cost, identical every run.
  - id: ingest
    builtin: ingest
    with:
      from: corpus

  # The map half. One session per paper, so a thirty-paper corpus never has to
  # fit in one context window, and a single unreadable file cannot discard the
  # analyses already paid for.
  - id: analyze
    agent: corpus-analyst
    model: ${vars.bulk}
    foreach: "corpus/text/*.md"
    parallel: 4
    input: |
      Analyse the paper at ${item.path}.
    output: analysis/papers/${item.id}.md

  # The reduce half. Reads only the per-paper analyses, never the papers.
  - id: profile
    agent: journal-profiler
    model: ${vars.judgement}
    input: |
      Read every analysis under analysis/papers/ and synthesise a profile of
      what this venue publishes and how it expects work to be written.

      If fewer analyses are present than the corpus contains, some papers failed
      to analyse. Say so in the profile rather than presenting it as complete.
    output: analysis/journal-profile.md

  - id: outline
    agent: outliner
    model: ${vars.judgement}
    input: |
      Topic: ${vars.topic}
      Journal profile: ${steps.profile.outputs}

      Produce the outline and the machine-readable section list.
    output:
      - outline/outline.md
      - outline/sections.json
