version: 1
name: demo-paper
description: >
  Five-minute demo. Profiles a two-paper synthetic corpus, then outlines a new
  manuscript for the same venue. Small on purpose: it exercises every part of
  the pipeline without a large model bill.

defaults:
  max_turns: 20

vars:
  # Model roles; empty means "use the model configured in pi settings".
  bulk: ""
  judgement: ""

  topic: >
    A physics-informed neural emulator for longwave radiative transfer,
    evaluated on the Hale et al. benchmark suite.

steps:
  - id: ingest
    builtin: ingest
    with:
      from: corpus

  # The map half: one session per paper.
  - id: analyze
    agent: corpus-analyst
    model: ${vars.bulk}
    foreach: "corpus/text/*.md"
    parallel: 2
    input: |
      Analyse the paper at ${item.path}.
    output: analysis/papers/${item.id}.md

  # The reduce half: reads the analyses, never the papers.
  - id: profile
    agent: journal-profiler
    model: ${vars.judgement}
    input: |
      Read every analysis under analysis/papers/ and synthesise a profile of
      what this venue publishes and how it expects work to be written.

      There are only two papers, so quantify norms as n/2 and be explicit that
      the sample is small.
    output: analysis/journal-profile.md

  - id: outline
    agent: outliner
    model: ${vars.judgement}
    input: |
      Topic: ${vars.topic}
      Journal profile: ${steps.profile.outputs}
      The author's own material is under source/ — read all of it first.

      The author has no results yet. Mark every place evidence is required with
      EVIDENCE NEEDED rather than inventing findings.
    output:
      - outline/outline.md
      - outline/sections.json

  # Stop here. The outline is the cheapest place to change direction: every
  # later stage is written against it.
  - id: approve-outline
    gate: Approve the outline before drafting
    show: outline/outline.md
    on_reject: outline

  # The second map: one session per section, so each is written against the
  # outline rather than against the growing draft, and a long paper never has to
  # fit in one context window.
  - id: write
    agent: section-writer
    model: ${vars.judgement}
    foreach:
      json: outline/sections.json
      path: sections
    parallel: 3
    input: |
      Draft the section "${item.title}" (id ${item.id}).

      Outline:         outline/outline.md
      Journal profile: analysis/journal-profile.md
      Author material: source/
    output: draft/${item.id}.md

  # Deterministic: ordering and concatenation need no judgement.
  - id: assemble
    builtin: assemble
    with:
      sections: outline/sections.json
      from: draft
      out: draft/paper.md

  - id: review
    agent: reviewer
    model: ${vars.judgement}
    input: |
      Review the draft at draft/paper.md as a referee for this venue.
    output: review/review.md

  - id: approve-review
    gate: Read the review before the final pass
    show:
      - review/review.md
    on_reject: write

  - id: polish
    agent: polisher
    model: ${vars.judgement}
    input: |
      Produce the final manuscript from draft/paper.md, applying review/review.md.
    output: final/paper.md
